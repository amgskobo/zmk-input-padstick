description: Convert absolute trackpad reports into joystick-like relative pointer motion

compatible: "zmk,input-processor-padstick"

include: ip_zero_param.yaml

properties:
  x-deadzone:
    type: int
    default: 48
    description: Absolute X counts around the touch origin that report zero motion.

  y-deadzone:
    type: int
    default: 48
    description: Absolute Y counts around the touch origin that report zero motion.

  x-scale:
    type: int
    default: 8
    description: X fine movement scale after the deadzone. 256 is 1.0x.

  y-scale:
    type: int
    default: 8
    description: Y fine movement scale after the deadzone. 256 is 1.0x.

  x-accel-range:
    type: int
    default: 464
    description: X counts after the deadzone used to ramp smoothly from x-scale to x-accel-scale.

  y-accel-range:
    type: int
    default: 464
    description: Y counts after the deadzone used to ramp smoothly from y-scale to y-accel-scale.

  x-accel-scale:
    type: int
    default: 12
    description: X scale reached at the end of x-accel-range. 256 is 1.0x.

  y-accel-scale:
    type: int
    default: 12
    description: Y scale reached at the end of y-accel-range. 256 is 1.0x.

  max-x:
    type: int
    default: 16
    description: Maximum absolute REL_X value emitted by this processor.

  max-y:
    type: int
    default: 16
    description: Maximum absolute REL_Y value emitted by this processor.

  x-center:
    type: int
    default: 512
    description: Fixed X center coordinate used when fixed-center is enabled.

  y-center:
    type: int
    default: 512
    description: Fixed Y center coordinate used when fixed-center is enabled.

  invert-x:
    type: boolean
    description: Invert generated REL_X direction.

  invert-y:
    type: boolean
    description: Invert generated REL_Y direction.

  radial:
    type: boolean
    description: |
      Take the distance from the origin before applying the ramp, then share the
      resulting step out along the two axes.

      Without this the axes are independent: the deadzone is square, and a ramp
      that rises with distance yields less when that distance is split between
      two axes than when it all lands on one, so a diagonal push runs slower
      than a straight one. With it the speed depends only on how far the finger
      has moved, and the deadzone becomes a circle.

      Costs one integer square root and one divide per axis event.

  fixed-center:
    type: boolean
    description: Use x-center and y-center as the joystick origin instead of the touched position.

  suppress-abs:
    type: boolean
    description: Suppress unconverted absolute events so ABS reports do not leak downstream.

  suppress-btn-touch:
    type: boolean
    description: Suppress BTN_TOUCH events after using them to track contact state.

  suppress-btn0:
    type: boolean
    description: Suppress BTN_0 events when the trackpad reports a physical click.
