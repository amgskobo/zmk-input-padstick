name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Recheck moving upstream and DYA main branches even without local changes.
    - cron: '28 2 * * 4'

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  math:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Exercise actual PadStick arithmetic with full branch coverage
        run: bash ./tests/run-math-docker.sh
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [upstream, dya]
    steps:
      - uses: actions/checkout@v5
      - name: Build and run the ${{ matrix.variant }} ZMK fixtures
        run: bash ./tests/run-integration-docker.sh ${{ matrix.variant }}
